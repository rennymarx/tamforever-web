<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Děkujeme — ozveme se do 24 hodin | TAM forever</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230f1226'/><text x='16' y='23' font-size='22' text-anchor='middle' fill='%23e3a13a' font-family='Georgia,serif'>%E2%88%9E</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@600;700&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<script>
/* P4: telefon producenta — doplnit shodně s index.html (prázdné = nezobrazí se) */
window.TAM = { phone: "" };
</script>
</head>
<body id="top">
<header class="nav">
  <div class="wrap nav__inner">
    <a class="nav__logo" href="/" aria-label="TAM forever — domů"><img src="assets/logo-foil.webp" alt="TAM forever" width="81" height="60" /></a>
    <a class="btn btn--sm nav__cta" href="/">← Zpět na web</a>
  </div>
</header>
<main>
  <section class="thanks">
    <p class="eyebrow">Poptávka odeslána</p>
    <h1>Díky<span class="dot">.</span></h1>
    <p class="lead">Ozveme se vám <strong>do 24 hodin</strong> — pondělí až neděli. Mezitím nám můžete kdykoli napsat na <a href="mailto:producent@tamforever.cz" style="color:var(--accent);">producent@tamforever.cz</a><span class="js-phone-inline"></span>.</p>
    <div style="margin-top:32px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;">
      <a class="btn" href="/">Zpět na hlavní stranu →</a>
      <a class="btn btn--ghost" href="/#repertoar">Prohlédnout repertoár</a>
    </div>
  </section>
</main>
<script>
/* Klikací telefon (P4) — stejná logika jako na homepage, lokálně (bez main.js závislostí) */
(function(){
  var p = (window.TAM && window.TAM.phone || "").trim();
  if (!p) return;
  var el = document.querySelector(".js-phone-inline");
  if (el) el.innerHTML = ' nebo zavolat na <a href="tel:' + p.replace(/\s+/g,"") + '" style="color:var(--accent);">' + p + '</a>';
})();
</script>
</body>
</html>
