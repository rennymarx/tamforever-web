# Netlify konfigurace — statický web, žádný build.
[build]
  publish = "."
  command = ""

# ---------- Drafty /gold a /green → 301 na ostrou homepage (spec §4) ----------
[[redirects]]
  from = "/gold/*"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/green/*"
  to = "/"
  status = 301
  force = true

# ---------- Interní dokumenty repa nepatří na produkci (DoD 1) ----------
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/OBSAH.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# ---------- Hezké URL bez .html ----------
[[redirects]]
  from = "/pro-mesta"
  to = "/pro-mesta.html"
  status = 200
[[redirects]]
  from = "/pro-firmy"
  to = "/pro-firmy.html"
  status = 200
[[redirects]]
  from = "/pro-svatby"
  to = "/pro-svatby.html"
  status = 200
[[redirects]]
  from = "/dekujeme"
  to = "/dekujeme.html"
  status = 200
[[redirects]]
  from = "/ochrana-osobnich-udaju"
  to = "/ochrana-osobnich-udaju.html"
  status = 200

# ---------- Bezpečnostní hlavičky (všude) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------- Cache ----------
# Assety (loga, og-image, favicony) — dlouhá cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# CSS/JS — vždy ověřit čerstvost, úpravy se projeví hned
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
