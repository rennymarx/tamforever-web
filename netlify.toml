# Netlify konfigurace — statický web, žádný build.
# Ostrý web = kořen (verze Gold, spuštěno 2026-10-11). Záloha designu: /green (noindex).
[build]
  publish = "."
  command = ""

# ---------- Interní soubory repa nepatří na produkci ----------
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/OBSAH.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_zaloha/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

# ---------- Staré drafty → ostrý web (301, odkazy z doby ladění nespadnou) ----------
[[redirects]]
  from = "/gold"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/gold/*"
  to = "/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/final"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/final/*"
  to = "/:splat"
  status = 301
  force = true

# ---------- Hezké URL bez .html ----------
[[redirects]]
  from = "/pro-mesta"
  to = "/pro-mesta.html"
  status = 200
[[redirects]]
  from = "/pro-firmy"
  to = "/pro-firmy.html"
  status = 200
[[redirects]]
  from = "/pro-svatby"
  to = "/pro-svatby.html"
  status = 200
[[redirects]]
  from = "/dekujeme"
  to = "/dekujeme.html"
  status = 200
[[redirects]]
  from = "/ochrana-osobnich-udaju"
  to = "/ochrana-osobnich-udaju.html"
  status = 200

# ---------- Záloha designu /green (noindex) ----------
[[redirects]]
  from = "/green/pro-mesta"
  to = "/green/pro-mesta.html"
  status = 200
[[redirects]]
  from = "/green/pro-firmy"
  to = "/green/pro-firmy.html"
  status = 200
[[redirects]]
  from = "/green/pro-svatby"
  to = "/green/pro-svatby.html"
  status = 200

# ---------- Bezpečnostní hlavičky (všude) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------- Cache ----------
# Assety (fotky, loga, favicony) — dlouhá cache. POZOR: při výměně obrázku použít NOVÝ název souboru.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# CSS/JS bez hashů v názvu → vždy ověřit čerstvost, úpravy se projeví hned
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/green/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
