# Netlify konfigurace — statický web, žádný build.
# Ostrý web = kořen (verze Gold, spuštěno 2026-10-11). Design Green jen jako záloha v _zaloha/green (od 2026-10-28 mimo produkci).
[build]
  publish = "."
  command = ""

# Jediná serverová část webu: GET /api/concerts (program koncertů z Google Kalendáře).
# Bez package.json a bez npm — funkce nemá závislosti, Netlify ji jen zabalí (esbuild).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------- Stará doména tamrock.cz (+ www) → tamforever.cz, trvale (301), vše na úvodní stránku (staré podstránky Webnode na novém webu neexistují) ----------
# Vyžaduje: tamrock.cz a www.tamrock.cz jako Domain alias v Netlify a DNS u Forpsi (A 75.2.60.5, www CNAME aesthetic-toffee-d9dfe5.netlify.app).
# Musí být PŘED ostatními pravidly (první shoda vyhrává). http varianty kryjí dobu, než Netlify vystaví certifikát.
[[redirects]]
  from = "https://tamrock.cz/*"
  to = "https://tamforever.cz/"
  status = 301
  force = true
[[redirects]]
  from = "http://tamrock.cz/*"
  to = "https://tamforever.cz/"
  status = 301
  force = true
[[redirects]]
  from = "https://www.tamrock.cz/*"
  to = "https://tamforever.cz/"
  status = 301
  force = true
[[redirects]]
  from = "http://www.tamrock.cz/*"
  to = "https://tamforever.cz/"
  status = 301
  force = true

# ---------- Interní soubory repa nepatří na produkci ----------
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/OBSAH.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_zaloha/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true
# zdrojáky funkce, testy a dev nástroje (publish = "." by je jinak servíroval jako statické soubory)
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.env.example"
  to = "/404.html"
  status = 404
  force = true

# ---------- Staré drafty a Green → ostrý web (301, staré odkazy nespadnou) ----------
[[redirects]]
  from = "/gold"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/gold/*"
  to = "/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/final"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/final/*"
  to = "/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/green"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/green/*"
  to = "/:splat"
  status = 301
  force = true

# ---------- Hezké URL bez .html ----------
[[redirects]]
  from = "/pro-mesta"
  to = "/pro-mesta.html"
  status = 200
[[redirects]]
  from = "/pro-firmy"
  to = "/pro-firmy.html"
  status = 200
[[redirects]]
  from = "/pro-svatby"
  to = "/pro-svatby.html"
  status = 200
[[redirects]]
  from = "/dekujeme"
  to = "/dekujeme.html"
  status = 200
[[redirects]]
  from = "/ochrana-osobnich-udaju"
  to = "/ochrana-osobnich-udaju.html"
  status = 200


# ---------- Bezpečnostní hlavičky (všude) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# POZOR: [[headers]] se na odpovědi Netlify Functions NEaplikují. Hlavičky /api/concerts (noindex, cache,
# Netlify-Vary) posílá výhradně samotná funkce (BASE_HEADERS v netlify/functions/concerts.mjs).

# ---------- Cache ----------
# Assety (fotky, loga, favicony) — dlouhá cache. POZOR: při výměně obrázku použít NOVÝ název souboru.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# CSS/JS bez hashů v názvu → vždy ověřit čerstvost, úpravy se projeví hned
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
