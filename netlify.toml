# Netlify konfigurace — statický web, žádný build.
[build]
  publish = "."
  command = ""

# Hezké URL bez .html — vývojové varianty /gold a /green
[[redirects]]
  from = "/gold/pro-mesta"
  to = "/gold/pro-mesta.html"
  status = 200
[[redirects]]
  from = "/gold/pro-firmy"
  to = "/gold/pro-firmy.html"
  status = 200
[[redirects]]
  from = "/gold/pro-svatby"
  to = "/gold/pro-svatby.html"
  status = 200
[[redirects]]
  from = "/green/pro-mesta"
  to = "/green/pro-mesta.html"
  status = 200
[[redirects]]
  from = "/green/pro-firmy"
  to = "/green/pro-firmy.html"
  status = 200
[[redirects]]
  from = "/green/pro-svatby"
  to = "/green/pro-svatby.html"
  status = 200

# Bezpečnostní hlavičky (všude)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Loga — dlouhá cache (nemění se)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Varianty — vždy ověřit čerstvost, aby se úpravy projevily hned
[[headers]]
  for = "/gold/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/green/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
