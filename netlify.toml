# Netlify konfigurace — statický web, žádný build.
# Root = Coming soon (veřejná). Drafty k ladění: /gold, /green, /final (noindex + robots Disallow).
[build]
  publish = "."
  command = ""

# ---------- Interní dokumenty repa nepatří na produkci ----------
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/OBSAH.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# ---------- Hezké URL bez .html — drafty ----------
[[redirects]]
  from = "/gold/pro-mesta"
  to = "/gold/pro-mesta.html"
  status = 200
[[redirects]]
  from = "/gold/pro-firmy"
  to = "/gold/pro-firmy.html"
  status = 200
[[redirects]]
  from = "/gold/pro-svatby"
  to = "/gold/pro-svatby.html"
  status = 200
[[redirects]]
  from = "/green/pro-mesta"
  to = "/green/pro-mesta.html"
  status = 200
[[redirects]]
  from = "/green/pro-firmy"
  to = "/green/pro-firmy.html"
  status = 200
[[redirects]]
  from = "/green/pro-svatby"
  to = "/green/pro-svatby.html"
  status = 200
[[redirects]]
  from = "/final/pro-mesta"
  to = "/final/pro-mesta.html"
  status = 200
[[redirects]]
  from = "/final/pro-firmy"
  to = "/final/pro-firmy.html"
  status = 200
[[redirects]]
  from = "/final/pro-svatby"
  to = "/final/pro-svatby.html"
  status = 200
[[redirects]]
  from = "/final/dekujeme"
  to = "/final/dekujeme.html"
  status = 200
[[redirects]]
  from = "/final/ochrana-osobnich-udaju"
  to = "/final/ochrana-osobnich-udaju.html"
  status = 200

# ---------- Bezpečnostní hlavičky (všude) ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------- Cache ----------
# Assety (loga, og-image, favicony) — dlouhá cache
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# Drafty — vždy ověřit čerstvost, úpravy se projeví hned
[[headers]]
  for = "/gold/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/green/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/final/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
