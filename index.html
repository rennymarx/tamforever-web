<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TAM forever — Coming soon</title>
<meta name="description" content="TAM forever — hlasitá pop-rocková kapela z Prahy. Nový web se brzy spustí." />
<meta property="og:title" content="TAM forever — Coming soon" />
<meta property="og:description" content="Něco se tu vaří. A brzy to pořádně bouchne." />
<meta property="og:image" content="https://tamforever.cz/assets/logo-foil.png" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0d'/><text x='16' y='23' font-size='22' text-anchor='middle' fill='%23e3a13a' font-family='Georgia,serif'>%E2%88%9E</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0a0a0d;
    color: #f4ecd7;
    font-family: "IBM Plex Mono", monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .cs {
    position: relative; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(12px, 2vh, 22px); padding: 32px 24px; text-align: center;
  }
  /* žhnoucí glow zespodu */
  .ember-bg {
    position: absolute; left: 50%; bottom: -6%; transform: translateX(-50%);
    width: min(820px, 120vw); height: 60vh;
    background: radial-gradient(ellipse at center bottom, rgba(227,161,58,0.18), rgba(227,161,58,0.05) 45%, transparent 70%);
    filter: blur(24px); pointer-events: none; z-index: 0;
  }
  .cs > *:not(.ember-bg):not(.est) { position: relative; z-index: 1; }

  .logo {
    height: clamp(160px, 40vh, 360px); width: auto; max-width: 88vw; display: block;
    filter: drop-shadow(0 10px 50px rgba(227,161,58,0.22));
  }
  .soon {
    margin: 0;
    font-family: "Antonio", sans-serif; font-weight: 700;
    font-size: clamp(1.9rem, 5.2vw, 3.4rem); line-height: 0.9; letter-spacing: 0.01em;
    text-transform: uppercase; color: #f4ecd7;
  }
  .soon .dot { color: #e3a13a; }

  /* ---------- KOTLÍK ---------- */
  .pot { position: relative; width: clamp(100px, 14vh, 150px); aspect-ratio: 200 / 210; }
  .pot-svg { width: 100%; height: 100%; display: block; }
  .steam {
    position: absolute; bottom: 44%; width: 13%; height: 30%; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(244,236,215,0.6), rgba(244,236,215,0) 70%);
    filter: blur(4px); opacity: 0; will-change: transform, opacity;
    animation: steam 3.4s ease-in infinite;
  }
  .s1 { left: 35%; animation-delay: 0s; }
  .s2 { left: 47%; animation-delay: 1.1s; }
  .s3 { left: 59%; animation-delay: 2.2s; }
  @keyframes steam {
    0%   { transform: translateY(0) translateX(0) scale(0.5); opacity: 0; }
    20%  { opacity: 0.65; }
    55%  { opacity: 0.45; }
    100% { transform: translateY(-150%) translateX(20%) scale(1.5); opacity: 0; }
  }
  .bubble { transform-box: fill-box; transform-origin: center; animation: bub 2.2s ease-in-out infinite; }
  .b2 { animation-delay: 0.7s; }
  @keyframes bub { 0%,100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-3px); opacity: 1; } }

  .wink {
    margin: 0; max-width: 420px;
    font-size: clamp(0.82rem, 2.2vw, 0.95rem); line-height: 1.6; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(244,236,215,0.62);
  }
  .wink b { color: #e3a13a; font-weight: 500; }
  .est { position: absolute; bottom: 18px; left: 0; right: 0; z-index: 1;
    font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(244,236,215,0.3); }

  @media (prefers-reduced-motion: reduce) {
    .steam, .bubble { animation: none; }
    .steam { opacity: 0.4; }
  }
</style>
</head>
<body>
  <main class="cs">
    <div class="ember-bg" aria-hidden="true"></div>

    <img class="logo" src="assets/logo-foil.png" alt="TAM forever" />

    <h1 class="soon">Coming soon<span class="dot">.</span></h1>

    <div class="pot" aria-hidden="true">
      <span class="steam s1"></span>
      <span class="steam s2"></span>
      <span class="steam s3"></span>
      <svg class="pot-svg" viewBox="0 0 200 210">
        <defs>
          <radialGradient id="liquid" cx="50%" cy="38%" r="72%">
            <stop offset="0%" stop-color="#ffd98a" />
            <stop offset="55%" stop-color="#e3a13a" />
            <stop offset="100%" stop-color="#c87035" />
          </radialGradient>
          <radialGradient id="ember" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#e3a13a" stop-opacity="0.85" />
            <stop offset="100%" stop-color="#e3a13a" stop-opacity="0" />
          </radialGradient>
        </defs>
        <!-- žhnoucí uhlíky pod kotlíkem -->
        <ellipse cx="100" cy="198" rx="62" ry="17" fill="url(#ember)" />
        <!-- tělo kotlíku -->
        <path d="M52 128 C52 179 70 195 100 195 C130 195 148 179 148 128 Z" fill="#14172a" stroke="#c87035" stroke-width="3" />
        <!-- ouška -->
        <path d="M52 138 C36 138 36 158 50 162" fill="none" stroke="#c87035" stroke-width="4" stroke-linecap="round" />
        <path d="M148 138 C164 138 164 158 150 162" fill="none" stroke="#c87035" stroke-width="4" stroke-linecap="round" />
        <!-- okraj -->
        <ellipse cx="100" cy="128" rx="50" ry="13" fill="#1c2138" stroke="#c87035" stroke-width="3" />
        <!-- hladina (vaří se) -->
        <ellipse cx="100" cy="126" rx="42" ry="9.5" fill="url(#liquid)" />
        <!-- bublinky -->
        <circle class="bubble b1" cx="88" cy="125" r="3" fill="#ffe1a0" />
        <circle class="bubble b2" cx="111" cy="126" r="2.4" fill="#ffe1a0" />
      </svg>
    </div>

    <p class="wink">Něco se tu <b>vaří</b>.<br>A brzy to pořádně <b>bouchne</b>.</p>

    <div class="est" aria-hidden="true">TAM forever · Praha · est. 2014</div>
  </main>
</body>
</html>
