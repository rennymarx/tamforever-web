<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TAM forever — Coming soon</title>
<meta name="description" content="TAM forever — hlasitá pop-rocková kapela z Prahy. Nový web se brzy spustí." />
<meta property="og:title" content="TAM forever — Coming soon" />
<meta property="og:description" content="Něco se tu vaří. A brzy to pořádně bouchne." />
<meta property="og:image" content="https://tamforever.cz/assets/logo-foil.png" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0d'/><text x='16' y='23' font-size='22' text-anchor='middle' fill='%23e3a13a' font-family='Georgia,serif'>%E2%88%9E</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0a0a0d;
    color: #f4ecd7;
    font-family: "IBM Plex Mono", monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .cs {
    position: relative; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(12px, 2vh, 22px); padding: 32px 24px; text-align: center;
  }
  /* žhnoucí glow zespodu */
  .ember-bg {
    position: absolute; left: 50%; bottom: -6%; transform: translateX(-50%);
    width: min(820px, 120vw); height: 60vh;
    background: radial-gradient(ellipse at center bottom, rgba(227,161,58,0.18), rgba(227,161,58,0.05) 45%, transparent 70%);
    filter: blur(24px); pointer-events: none; z-index: 0;
  }
  .cs > *:not(.ember-bg):not(.est) { position: relative; z-index: 1; }

  .logo {
    height: clamp(160px, 40vh, 360px); width: auto; max-width: 88vw; display: block;
    filter: drop-shadow(0 10px 50px rgba(227,161,58,0.22));
  }
  .soon {
    margin: 0;
    font-family: "Antonio", sans-serif; font-weight: 700;
    font-size: clamp(1.9rem, 5.2vw, 3.4rem); line-height: 0.9; letter-spacing: 0.01em;
    text-transform: uppercase; color: #f4ecd7;
  }
  .soon .dot { color: #e3a13a; }

  /* ---------- ROCKOVÝ KOTEL NA ŽHNOUCÍ PLOTÝNCE (sopka před výbuchem) ---------- */
  .pot { position: relative; width: clamp(160px, 24vh, 250px); aspect-ratio: 220 / 205; }
  .pot-svg { width: 100%; height: 100%; display: block; }

  /* poklička se pod tlakem nadzvedává a rachotí */
  .lid { transform-box: fill-box; transform-origin: center bottom; animation: rattle 0.45s ease-in-out infinite; }
  @keyframes rattle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-2.5px) rotate(-3deg); }
    50% { transform: translateY(-1px) rotate(0deg); }
    75% { transform: translateY(-2.5px) rotate(3deg); }
  }
  /* žhnoucí plotýnka — žár + spirály */
  .embers { transform-box: fill-box; transform-origin: center; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(0.92); } 50% { opacity: 1; transform: scale(1.12); } }
  .plotna { animation: flick 0.9s ease-in-out infinite; }
  @keyframes flick { 0%, 100% { opacity: 0.85; } 35% { opacity: 1; } 70% { opacity: 0.6; } }

  /* pára (hustá) */
  .steam {
    position: absolute; border-radius: 50%; opacity: 0; will-change: transform, opacity;
    background: radial-gradient(ellipse at center, rgba(244,236,215,0.8), rgba(244,236,215,0) 70%);
    filter: blur(5px);
  }
  .s1, .s2, .s3, .s4, .s5 { width: 16%; height: 34%; bottom: 52%; animation: plume 2.4s ease-in infinite; }
  .s1 { left: 33%; animation-delay: 0s; }
  .s2 { left: 43%; animation-delay: 0.5s; }
  .s3 { left: 53%; animation-delay: 1s; }
  .s4 { left: 62%; animation-delay: 1.5s; }
  .s5 { left: 47%; animation-delay: 2s; }
  @keyframes plume {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    25% { opacity: 0.85; }
    60% { opacity: 0.5; }
    100% { transform: translateY(-180%) scale(1.7); opacity: 0; }
  }
  /* boční trysky páry zpod pokličky */
  .jet-l, .jet-r { width: 12%; height: 24%; bottom: 49%; animation: jet 2s ease-out infinite; }
  .jet-l { left: 21%; --jx: -55%; }
  .jet-r { right: 21%; --jx: 55%; animation-delay: 1s; }
  @keyframes jet {
    0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
    30% { opacity: 0.7; }
    100% { transform: translate(var(--jx), -130%) scale(1.3); opacity: 0; }
  }
  /* jiskry z plotýnky */
  .spark { position: absolute; bottom: 7%; width: 4px; height: 4px; border-radius: 50%;
    background: #ffd27a; box-shadow: 0 0 7px 1px rgba(255,170,70,0.95); opacity: 0; will-change: transform, opacity; }
  .k1 { left: 30%; --sx: -2vw; animation: spark 1.5s ease-out infinite; }
  .k2 { left: 42%; --sx: 1.6vw; animation: spark 1.7s ease-out infinite; animation-delay: 0.4s; }
  .k3 { left: 54%; --sx: -1vw; animation: spark 1.3s ease-out infinite; animation-delay: 0.8s; }
  .k4 { left: 64%; --sx: 2.6vw; animation: spark 1.8s ease-out infinite; animation-delay: 1.1s; }
  .k5 { left: 48%; --sx: -2.6vw; animation: spark 1.45s ease-out infinite; animation-delay: 1.5s; }
  @keyframes spark {
    0% { transform: translate(0, 0) scale(1); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translate(var(--sx), -19vh) scale(0.2); opacity: 0; }
  }
  /* prskání zpod pokličky */
  .spit { position: absolute; bottom: 50%; width: 5px; height: 5px; border-radius: 50%;
    background: #ffba50; box-shadow: 0 0 5px rgba(255,140,50,0.85); opacity: 0; will-change: transform, opacity; }
  .p1 { left: 30%; --px: -3vw; animation: spit 1.6s ease-out infinite; animation-delay: 0.3s; }
  .p2 { right: 30%; --px: 3vw; animation: spit 1.9s ease-out infinite; animation-delay: 1.1s; }
  .p3 { left: 50%; --px: 0.6vw; animation: spit 1.35s ease-out infinite; animation-delay: 0.7s; }
  @keyframes spit {
    0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
    25% { opacity: 1; transform: translate(calc(var(--px) * 0.6), -3.5vh) scale(1); }
    100% { transform: translate(var(--px), 1.5vh) scale(0.3); opacity: 0; }
  }

  .wink {
    margin: 0; max-width: 420px;
    font-size: clamp(0.82rem, 2.2vw, 0.95rem); line-height: 1.6; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(244,236,215,0.62);
  }
  .wink b { color: #e3a13a; font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    .steam, .lid, .embers, .plotna { animation: none !important; }
    .steam { opacity: 0.4; }
    .spark, .spit { display: none; }
  }
</style>
</head>
<body>
  <main class="cs">
    <div class="ember-bg" aria-hidden="true"></div>

    <img class="logo" src="assets/logo-foil.png" alt="TAM forever" />

    <h1 class="soon">Coming soon<span class="dot">.</span></h1>

    <div class="pot" aria-hidden="true">
      <svg class="pot-svg" viewBox="0 0 220 205">
        <defs>
          <radialGradient id="ember" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff5a1f" stop-opacity="1" />
            <stop offset="45%" stop-color="#ff7a2f" stop-opacity="0.65" />
            <stop offset="100%" stop-color="#ff7a2f" stop-opacity="0" />
          </radialGradient>
        </defs>
        <!-- žhnoucí plotýnka pod kotlem -->
        <ellipse class="embers" cx="110" cy="190" rx="94" ry="32" fill="url(#ember)" />
        <ellipse cx="110" cy="194" rx="76" ry="15" fill="#0c0e1a" />
        <g class="plotna">
          <ellipse cx="110" cy="193" rx="60" ry="11" fill="none" stroke="#ff6a2a" stroke-width="4" />
          <ellipse cx="110" cy="193" rx="38" ry="7" fill="none" stroke="#ff8a3d" stroke-width="3.5" />
          <ellipse cx="110" cy="193" rx="16" ry="3.5" fill="none" stroke="#ffba50" stroke-width="3" />
        </g>
        <!-- tělo kotle -->
        <path d="M38 100 C38 158 72 182 110 182 C148 182 182 158 182 100 Z" fill="#15182a" stroke="#c87035" stroke-width="3.5" />
        <!-- ucha -->
        <path d="M39 112 C20 112 20 140 37 144" fill="none" stroke="#c87035" stroke-width="5" stroke-linecap="round" />
        <path d="M181 112 C200 112 200 140 183 144" fill="none" stroke="#c87035" stroke-width="5" stroke-linecap="round" />
        <!-- okraj kotle -->
        <ellipse cx="110" cy="100" rx="64" ry="15" fill="#1c2138" stroke="#c87035" stroke-width="3.5" />
        <!-- poklička (nadzvednutá tlakem, rachotí) -->
        <g class="lid">
          <path d="M50 98 C50 70 170 70 170 98 Z" fill="#20253f" stroke="#c87035" stroke-width="3" />
          <ellipse cx="110" cy="98" rx="60" ry="11" fill="#20253f" stroke="#c87035" stroke-width="3" />
          <rect x="103" y="55" width="14" height="13" rx="3.5" fill="#c87035" />
          <ellipse cx="110" cy="55" rx="7" ry="3" fill="#c87035" />
        </g>
      </svg>
      <!-- pára -->
      <span class="steam s1"></span><span class="steam s2"></span><span class="steam s3"></span><span class="steam s4"></span><span class="steam s5"></span>
      <span class="steam jet-l"></span><span class="steam jet-r"></span>
      <!-- jiskry z plotýnky -->
      <span class="spark k1"></span><span class="spark k2"></span><span class="spark k3"></span><span class="spark k4"></span><span class="spark k5"></span>
      <!-- prskání zpod pokličky -->
      <span class="spit p1"></span><span class="spit p2"></span><span class="spit p3"></span>
    </div>

    <p class="wink">Něco se tu <b>vaří</b>.<br>A brzy to pořádně <b>bouchne</b>.</p>
  </main>
</body>
</html>
