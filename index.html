<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TAM forever — Coming soon</title>
<meta name="description" content="TAM forever — hlasitá pop-rocková kapela z Prahy. Nový web se brzy spustí." />
<meta property="og:title" content="TAM forever — Coming soon" />
<meta property="og:description" content="Něco se tu vaří. A brzy to pořádně bouchne." />
<meta property="og:image" content="https://tamforever.cz/assets/logo-foil.png" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a0d'/><text x='16' y='23' font-size='22' text-anchor='middle' fill='%23e3a13a' font-family='Georgia,serif'>%E2%88%9E</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0a0a0d;
    color: #f4ecd7;
    font-family: "IBM Plex Mono", monospace;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .cs {
    position: relative; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(12px, 2vh, 22px); padding: 32px 24px; text-align: center;
  }
  /* žhnoucí glow zespodu */
  .ember-bg {
    position: absolute; left: 50%; bottom: -6%; transform: translateX(-50%);
    width: min(820px, 120vw); height: 60vh;
    background: radial-gradient(ellipse at center bottom, rgba(227,161,58,0.18), rgba(227,161,58,0.05) 45%, transparent 70%);
    filter: blur(24px); pointer-events: none; z-index: 0;
  }
  .cs > *:not(.ember-bg):not(.est) { position: relative; z-index: 1; }

  .logo {
    height: clamp(160px, 40vh, 360px); width: auto; max-width: 88vw; display: block;
    filter: drop-shadow(0 10px 50px rgba(227,161,58,0.22));
  }
  .soon {
    margin: 0;
    font-family: "Antonio", sans-serif; font-weight: 700;
    font-size: clamp(1.9rem, 5.2vw, 3.4rem); line-height: 0.9; letter-spacing: 0.01em;
    text-transform: uppercase; color: #f4ecd7;
  }
  .soon .dot { color: #e3a13a; }

  /* ---------- ROCKOVÝ KOTEL (sopka před výbuchem) ---------- */
  .pot { position: relative; width: clamp(150px, 22vh, 230px); aspect-ratio: 220 / 200; }
  .pot-svg { width: 100%; height: 100%; display: block; }

  /* poklička se pod tlakem nadzvedává a rachotí */
  .lid { transform-box: fill-box; transform-origin: center bottom; animation: rattle 0.5s ease-in-out infinite; }
  @keyframes rattle {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-2px) rotate(-2.5deg); }
    50% { transform: translateY(-1px) rotate(0deg); }
    75% { transform: translateY(-2px) rotate(2.5deg); }
  }
  /* žár pod kotlem pulzuje */
  .embers { transform-box: fill-box; transform-origin: center; animation: pulse 1.7s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.7; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1.08); } }

  /* pára */
  .steam {
    position: absolute; border-radius: 50%; opacity: 0; will-change: transform, opacity;
    background: radial-gradient(ellipse at center, rgba(244,236,215,0.8), rgba(244,236,215,0) 70%);
    filter: blur(5px);
  }
  .s1, .s2, .s3 { width: 17%; height: 36%; bottom: 53%; animation: plume 2.6s ease-in infinite; }
  .s1 { left: 36%; animation-delay: 0s; }
  .s2 { left: 49%; animation-delay: 0.9s; }
  .s3 { left: 60%; animation-delay: 1.8s; }
  @keyframes plume {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    25% { opacity: 0.85; }
    60% { opacity: 0.5; }
    100% { transform: translateY(-175%) scale(1.7); opacity: 0; }
  }
  /* boční trysky páry zpod pokličky (uniká tlak) */
  .jet-l, .jet-r { width: 12%; height: 24%; bottom: 49%; animation: jet 2.1s ease-out infinite; }
  .jet-l { left: 22%; --jx: -55%; }
  .jet-r { right: 22%; --jx: 55%; animation-delay: 1s; }
  @keyframes jet {
    0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
    30% { opacity: 0.7; }
    100% { transform: translate(var(--jx), -130%) scale(1.3); opacity: 0; }
  }

  .wink {
    margin: 0; max-width: 420px;
    font-size: clamp(0.82rem, 2.2vw, 0.95rem); line-height: 1.6; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(244,236,215,0.62);
  }
  .wink b { color: #e3a13a; font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    .steam, .bubble { animation: none; }
    .steam { opacity: 0.4; }
  }
</style>
</head>
<body>
  <main class="cs">
    <div class="ember-bg" aria-hidden="true"></div>

    <img class="logo" src="assets/logo-foil.png" alt="TAM forever" />

    <h1 class="soon">Coming soon<span class="dot">.</span></h1>

    <div class="pot" aria-hidden="true">
      <span class="steam jet-l"></span>
      <span class="steam jet-r"></span>
      <span class="steam s1"></span>
      <span class="steam s2"></span>
      <span class="steam s3"></span>
      <svg class="pot-svg" viewBox="0 0 220 200">
        <defs>
          <radialGradient id="ember" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ff7a2f" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#ff7a2f" stop-opacity="0" />
          </radialGradient>
        </defs>
        <!-- žhnoucí uhlíky pod kotlem (pulzují) -->
        <ellipse class="embers" cx="110" cy="188" rx="84" ry="22" fill="url(#ember)" />
        <!-- nožky -->
        <path d="M74 176 l-7 16 M146 176 l7 16 M110 182 v17" stroke="#0e1020" stroke-width="7" stroke-linecap="round" fill="none" />
        <!-- tělo kotle -->
        <path d="M38 102 C38 162 72 186 110 186 C148 186 182 162 182 102 Z" fill="#15182a" stroke="#c87035" stroke-width="3.5" />
        <!-- ucha -->
        <path d="M39 114 C20 114 20 142 37 146" fill="none" stroke="#c87035" stroke-width="5" stroke-linecap="round" />
        <path d="M181 114 C200 114 200 142 183 146" fill="none" stroke="#c87035" stroke-width="5" stroke-linecap="round" />
        <!-- okraj kotle -->
        <ellipse cx="110" cy="102" rx="64" ry="15" fill="#1c2138" stroke="#c87035" stroke-width="3.5" />
        <!-- poklička (nadzvednutá tlakem, rachotí) -->
        <g class="lid">
          <path d="M50 100 C50 72 170 72 170 100 Z" fill="#20253f" stroke="#c87035" stroke-width="3" />
          <ellipse cx="110" cy="100" rx="60" ry="11" fill="#20253f" stroke="#c87035" stroke-width="3" />
          <rect x="103" y="57" width="14" height="13" rx="3.5" fill="#c87035" />
          <ellipse cx="110" cy="57" rx="7" ry="3" fill="#c87035" />
        </g>
      </svg>
    </div>

    <p class="wink">Něco se tu <b>vaří</b>.<br>A brzy to pořádně <b>bouchne</b>.</p>
  </main>
</body>
</html>
